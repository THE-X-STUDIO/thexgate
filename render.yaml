services:
  - type: web
    name: thexgate
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python paper_service.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: GATE_DURATION
        value: "172800"
      - key: SUPA_STATE_URI
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
